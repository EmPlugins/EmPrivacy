name: Release

# Marketplace actions are rejected: the EmPlugins org allows only actions
# defined in this repository. Version Packages and npm publish run locally.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git -c credential.helper= -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" fetch --depth=50 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Install Node.js and pnpm
        run: bash scripts/ci-toolchain.sh
      - run: pnpm install --frozen-lockfile
      - name: Version packages or publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release-or-version.mjs
