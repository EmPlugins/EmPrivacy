name: Release

# Marketplace actions are rejected: the EmPlugins org allows only actions
# defined in this repository. Version Packages and npm publish run locally.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_TERMINAL_PROMPT=0
          git config --global --unset-all credential.helper || true
          git init -q .
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=50 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
          git config --local --unset-all http.https://github.com/.extraheader
      - name: Install Node.js and pnpm
        run: bash scripts/ci-toolchain.sh
      - run: pnpm install --frozen-lockfile
      - name: Version packages or publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release-or-version.mjs
