name: CI

# Marketplace actions are rejected: the EmPlugins org allows only actions
# defined in this repository. Checkout and the toolchain are local steps.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emdash_version:
          - 1.0.1
    name: test (emdash@${{ matrix.emdash_version }})
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          REF="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          git -c credential.helper= -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" fetch --depth=1 origin "$REF"
          git checkout --detach FETCH_HEAD
      - name: Install Node.js and pnpm
        run: bash scripts/ci-toolchain.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D emdash@${{ matrix.emdash_version }}
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run verify:exports
      - run: pnpm run audit
